<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quote of the day, short famous quotes</title>
  <meta name="description" content="A short, famous quote for today, with a new one on every tap. Copy it or share it on X.">
  <meta name="theme-color" content="#f5f0e6">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script>
    // Before first paint: the saved choice wins, otherwise follow the device/browser theme.
    try {
      var t = localStorage.getItem('quotes_theme');
      if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      if (t === 'dark') document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="./">
      <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M9 20.5c0-4 1.6-7 5-8.5l.8 1.6c-1.8 1-2.6 2.2-2.7 3.6H15v5.3H9zm8.5 0c0-4 1.6-7 5-8.5l.8 1.6c-1.8 1-2.6 2.2-2.7 3.6h2.9v5.3h-6z" fill="#fff"/></svg>
      Quotes
    </a>
    <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch dark or light theme">
      <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main class="stage">
    <p class="label" id="label">Quote of the day</p>
    <figure class="quote" id="quote-box" aria-live="polite">
      <blockquote id="quote-text">Loading…</blockquote>
      <figcaption id="quote-author"></figcaption>
    </figure>

    <div class="actions">
      <button class="btn primary" id="new-btn" type="button">New quote</button>
      <button class="btn" id="copy-btn" type="button">Copy</button>
      <a class="btn" id="share-btn" href="https://twitter.com/intent/tweet" target="_blank" rel="noopener">Share on X</a>
    </div>
    <p class="hint">Tip: press Space for a new quote.</p>
  </main>

  <footer class="foot">
    <a href="https://zakyprojects.github.io/">Made by Zakria</a>
  </footer>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="script.js"></script>
</body>
</html>
